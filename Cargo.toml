[package]
name = "stp-for-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Select Text Process client for Windows"
publish = false

[lib]
name = "stp"
path = "src/lib.rs"

[[bin]]
name = "stp"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.45", features = ["derive"] }
reqwest = { version = "0.12.23", default-features = false, features = ["gzip", "http2", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.16"
url = "2.5.7"

[dev-dependencies]
tempfile = "3.21.0"
