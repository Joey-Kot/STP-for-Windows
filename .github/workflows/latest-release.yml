name: Build and Publish Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Windows release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Windows GNU linker
        run: sudo apt-get update && sudo apt-get install --yes mingw-w64

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint Rust Windows target
        run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --all-targets

      - name: Cross-check Windows target
        run: cargo check --locked --target x86_64-pc-windows-gnu --all-targets

      - name: Build Windows binary
        run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu --bin stp
          mkdir -p dist/package
          cp target/x86_64-pc-windows-gnu/release/stp.exe dist/package/

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.1

      - name: Generate Rust dependency licenses
        run: |
          mkdir -p THIRD_PARTY_LICENSES
          cargo about generate --locked --target x86_64-pc-windows-gnu about.hbs -o THIRD_PARTY_LICENSES/RUST-DEPENDENCIES.html

      - name: Check constraints and third-party notices
        run: |
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES.txt
          test -s docs/rust-rewrite-contract.md
          test -s THIRD_PARTY_LICENSES/keybd_event-MIT.txt
          test -s THIRD_PARTY_LICENSES/RUST-DEPENDENCIES.html
          if rg --hidden --glob '!docs/rust-rewrite-contract.md' --glob '!target/**' --glob '!*.md' 'SendInput' src tests Cargo.toml; then
            echo 'SendInput is forbidden in the implementation'
            exit 1
          fi

      - name: Check Windows runtime dependencies
        run: |
          imports="$(x86_64-w64-mingw32-objdump -p dist/package/stp.exe | sed -n 's/.*DLL Name: //p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          echo "$imports"
          if echo "$imports" | rg -i 'libgcc|libstdc\+\+|libwinpthread'; then
            echo 'Unexpected MinGW runtime DLL dependency'
            exit 1
          fi

      - name: Assemble package
        run: |
          cp README.md README_ZH.md LICENSE NOTICE THIRD_PARTY_NOTICES.txt dist/package/
          cp -R THIRD_PARTY_LICENSES dist/package/

      - name: Package
        run: |
          cd dist/package
          zip -qr ../stp-windows-amd64.zip .
          cd ../..
          sha256sum dist/stp-windows-amd64.zip > dist/stp-windows-amd64.zip.sha256

      - name: Move Latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated Windows amd64 build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          if gh release view Latest; then
            gh release edit Latest --title "Latest" --notes "$notes"
          else
            gh release create Latest --title "Latest" --notes "$notes"
          fi
          for asset in \
            stp-windows-amd64-go.zip \
            stp-windows-amd64-go.zip.sha256 \
            stp-windows-amd64-rust.zip \
            stp-windows-amd64-rust.zip.sha256; do
            if gh release view Latest --json assets --jq '.assets[].name' | rg -Fx "$asset"; then
              gh release delete-asset Latest "$asset" --yes
            fi
          done
          gh release upload Latest \
            dist/stp-windows-amd64.zip \
            dist/stp-windows-amd64.zip.sha256 \
            --clobber
