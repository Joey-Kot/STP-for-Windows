name: Build and Publish Latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Check third-party notices
        run: |
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES.txt
          grep -qi 'clipboard' THIRD_PARTY_NOTICES.txt
          grep -qi 'keybd_event' THIRD_PARTY_NOTICES.txt
          test -s THIRD_PARTY_LICENSES/clipboard-BSD-3-Clause.txt
          test -s THIRD_PARTY_LICENSES/keybd_event-MIT.txt

      - name: Build Windows binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w" -o dist/package/stp.exe ./cmd/stp
          cp README.md LICENSE NOTICE THIRD_PARTY_NOTICES.txt dist/package/
          cp -R THIRD_PARTY_LICENSES dist/package/

      - name: Package
        run: |
          cd dist/package
          python3 -m zipfile -c ../stp-windows-amd64.zip stp.exe README.md LICENSE NOTICE THIRD_PARTY_NOTICES.txt THIRD_PARTY_LICENSES/*
          cd ../..
          sha256sum dist/stp-windows-amd64.zip > dist/stp-windows-amd64.zip.sha256

      - name: Move Latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          if gh release view Latest >/dev/null 2>&1; then
            gh release edit Latest --title "Latest" --notes "$notes"
          else
            gh release create Latest --title "Latest" --notes "$notes"
          fi
          gh release upload Latest \
            dist/stp-windows-amd64.zip \
            dist/stp-windows-amd64.zip.sha256 \
            --clobber
